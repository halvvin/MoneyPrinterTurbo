name: android

on:
  push:
    branches: [android-native, android-native-pass12]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  ffmpeg:
    name: Cross-compile static FFmpeg (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm file
      - name: Build FFmpeg
        run: |
          chmod +x android/scripts/build_ffmpeg_android.sh
          android/scripts/build_ffmpeg_android.sh android/app/src/main/jniLibs/arm64-v8a
      - name: Verify binary
        run: |
          B=android/app/src/main/jniLibs/arm64-v8a/libffmpeg_exec.so
          test -s "$B"
          file "$B" | grep -E 'ELF|aarch64|ARM'
          # PIE executable?
          readelf -h "$B" | grep Type | grep -E 'DYN|EXEC'
          du -h "$B"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/libffmpeg_exec.so

  build:
    name: Android build + tests
    runs-on: ubuntu-latest
    needs: ffmpeg
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download FFmpeg binary
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-arm64
          path: android/app/src/main/jniLibs/arm64-v8a
      - name: Restore ffmpeg binary permissions
        run: chmod +x app/src/main/jniLibs/arm64-v8a/libffmpeg_exec.so
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug + release APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Verify APK contents
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libffmpeg_exec.so
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'arm64-v8a'
      - name: SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mpt-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mpt-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
